name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Build release di CI, bukan cuma debug: bug R8/Gson yang merusak
      # penjadwalan notifikasi HANYA muncul di release build. Mesin lokal
      # tidak bisa menjalankan Gradle, jadi ini satu-satunya gerbang yang
      # membuktikan proguard-rules.pro benar-benar terpasang.
      - run: flutter build apk --release
